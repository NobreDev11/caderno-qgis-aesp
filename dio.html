<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno da Trilha DIO</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#5b3cc4">
<meta name="apple-mobile-web-app-title" content="Cadernos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/caderno.css">
<style>
/* Caderno da Trilha DIO: o mesmo app do caderno QGIS (caderno.js/.css), nas cores da DIO (roxo). */
:root{
  --bg:#f4f3f8; --surface:#ffffff; --ink:#1c1a26; --muted:#62607a; --line:#dddbe8;
  --accent:#5b3cc4; --accent-ink:#ffffff; --accent-soft:#ebe6fb;
  --ok:#2f7d32; --warn:#a86400; --bad:#b3261e;
  --display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121119; --surface:#1b1a24; --ink:#e7e5f0; --muted:#a3a0b8; --line:#2f2d3c;
    --accent:#a58cf5; --accent-ink:#14111f; --accent-soft:#2a2442;
    --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121119; --surface:#1b1a24; --ink:#e7e5f0; --muted:#a3a0b8; --line:#2f2d3c;
  --accent:#a58cf5; --accent-ink:#14111f; --accent-soft:#2a2442;
  --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
}
*{box-sizing:border-box}
.rt-ok{color:var(--ok)} .rt-mal{color:var(--bad)}
.it-l{all:unset;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:13.5px}
.it-l:hover{background:var(--accent-soft)}.it-l .it-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<body>
<div class="app">
  <aside>
    <div class="topo"><button type="button" class="menu-bt" id="menuBt" aria-label="Recolher menu" aria-expanded="true" title="Recolher menu"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button></div>
    <div class="brand">
      <p style="margin:0 0 6px" id="voltarCursos"><a href="/" style="color:var(--accent);font-size:13px;text-decoration:none">← Cursos</a></p>
      <h1>Trilha DIO: agentes de IA e dados</h1>
      <p>Do zero ao avançado · 1 h por dia · desde 09/11/2026</p>
    </div>
    <nav id="nav"></nav>
    <div class="prog" id="prog"></div>
    <div id="tmini" style="margin-top:auto"></div>
    <div class="sync" style="margin-top:0"><span id="sinfo"></span><span class="dot" id="sdot"></span><span id="stxt" style="flex:1;min-width:0;overflow-wrap:anywhere">Carregando…</span><button class="btn sm" id="sbtn" hidden>Entrar</button></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="paneHost"></div>
<div id="floatHost"></div>
<script src="/vendor/supabase.js"></script>
<script src="/prompts-dio.js"></script>
<script src="/curso-dio.js"></script>
<script src="/caderno.js"></script>
<script src="/dio.js"></script>
<script>
// Temporizador: meta de 1 h por dia; o tempo de foco soma no item atual da trilha.
window.TIMER_CFG={ls:"caderno-dio:timer", meta:60, alvo:()=>{ const a=atual(); return a?{id:a.id, nome:a.n+". "+a.nome, rot:"item "+a.n}:null; }};
</script>
<script src="/timer.js"></script>
<script>
// Fluxogramas: a anotação aberta no painel (item ou nota) é onde o fluxograma é inserido/editado.
window.FLUXO_ALVO=()=>{
  if(!PANE) return null;
  if(PANE.tipo==="aula"){ const id=PANE.id; return {ta:()=>document.getElementById("inota"),
    get:()=>{ const ta=document.getElementById("inota"); return ta?ta.value:(itemD(id).nota||""); },
    set:v=>{ salvarDoc("item-"+id,{...itemD(id),tipo:"item",nota:v},50); renderPane(); sincronizarFlutuante(); }}; }
  if(PANE.tipo==="nota"){ const id=PANE.id; return {ta:()=>document.getElementById("ntxt"),
    get:()=>{ const ta=document.getElementById("ntxt"); return ta?ta.value:((S.docs[id]||{}).texto||""); },
    set:v=>{ const ta=document.getElementById("ntxt"); if(ta){ ta.value=v; salvarNotaDoForm(); } else salvarDoc(id,{...(S.docs[id]||{tipo:"nota",criado:Date.now()}),tipo:"nota",texto:v},50); renderPane(); }}; }
  return null;
};
</script>
<script src="/fluxo.js"></script>
<script src="/formato.js"></script>
<script>
/* Funciona sem internet: guarda o app no aparelho (sw.js). */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
