<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno QGIS AESP</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-title" content="Caderno QGIS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/caderno.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="topo"><button type="button" class="menu-bt" id="menuBt" aria-label="Recolher menu" aria-expanded="true" title="Recolher menu"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button></div>
    <div class="brand">
      <p style="margin:0 0 6px" id="voltarCursos"><a href="/" style="color:var(--accent);font-size:13px;text-decoration:none">← Cursos</a></p>
      <h1>Uso do QGIS como Estratégia de Segurança Pública</h1>
      <p>AESP/CE · Turma 01/2026 · Grupo 1 · 09 a 18/11</p>
    </div>
    <nav id="nav"></nav>
    <div class="prog" id="prog"></div>
    <div id="tmini" style="margin-top:auto"></div>
    <div class="sync" style="margin-top:0"><span id="sinfo"></span><span class="dot" id="sdot"></span><span id="stxt" style="flex:1;min-width:0;overflow-wrap:anywhere">Carregando…</span><button class="btn sm" id="sbtn" hidden>Entrar</button></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="paneHost"></div>
<div id="floatHost"></div>
<script src="/vendor/supabase.js"></script>
<script src="/prompts.js"></script>
<script src="/curso-qgis.js"></script>
<script src="/curso-base.js"></script>
<script src="/caderno.js"></script>
<script src="/livre.js"></script>
<script>
// Temporizador: o tempo de foco soma na disciplina da aula atual (ou da próxima).
window.TIMER_CFG={ls:"caderno-qgis-aesp:timer", meta:null, alvo:()=>{ const a=focoAula(); return a?{id:a.k, nome:nomeDisc(a.k), rot:"disciplina atual"}:null; }};
</script>
<script src="/timer.js"></script>
<script>
// Fluxogramas: a anotação aberta no painel (aula ou nota) é onde o fluxograma é inserido/editado.
window.FLUXO_ALVO=()=>{
  if(!PANE) return null;
  if(PANE.tipo==="aula"){ const id=PANE.id; return {ta:()=>document.getElementById("pnota"),
    get:()=>{ const ta=document.getElementById("pnota"); return ta?ta.value:notaDaAula(id); },
    set:v=>{ salvarNotaAula(id,v); renderPane(); sincronizarFlutuante(); }}; }
  if(PANE.tipo==="nota"){ const id=PANE.id; return {ta:()=>document.getElementById("ntxt"),
    get:()=>{ const ta=document.getElementById("ntxt"); return ta?ta.value:((S.docs[id]||{}).texto||""); },
    set:v=>{ const ta=document.getElementById("ntxt"); if(ta){ ta.value=v; salvarNotaDoForm(); } else salvarDoc(id,{...(S.docs[id]||{tipo:"nota",criado:Date.now()}),tipo:"nota",texto:v},50); renderPane(); }}; }
  return null;
};
</script>
<script src="/fluxo.js"></script>
<script src="/formato.js"></script>
<script>
/* Funciona sem internet: guarda o app no aparelho (sw.js). */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
