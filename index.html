<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadernos de Estudo</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-title" content="Cadernos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Página de entrada: login e uma aba por curso. Cada aba leva ao caderno daquele curso (/qgis, /dio). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --ok:#2f7d32; --warn:#a86400; --bad:#b3261e;
  --display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --surface:#16211e; --ink:#e3ece8; --muted:#9aaba5; --line:#2a3834;
    --accent:#4fb8a3; --accent-ink:#0b1311; --accent-soft:#1d3530;
    --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e3ece8; --muted:#9aaba5; --line:#2a3834;
  --accent:#4fb8a3; --accent-ink:#0b1311; --accent-soft:#1d3530;
  --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  background-image:repeating-radial-gradient(circle at 110% -20%, transparent 0 26px, color-mix(in srgb,var(--accent) 6%,transparent) 26px 27px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 60px;display:flex;flex-direction:column;gap:20px}
h1{font:800 28px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:800 22px/1.2 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:14px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{border-bottom-color:var(--c);color:var(--ink)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.curso{border-left:6px solid var(--c)}
.curso .k{font:500 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.curso h2{margin:6px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c)}
.foot{font-size:12.5px;color:var(--muted)}
.foot a{color:var(--accent)}
@media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr} h1{font-size:24px} }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<script src="/vendor/supabase.js"></script>
<script>
"use strict";
/* Mesmo Supabase e mesma sessão dos cadernos (storageKey compartilhada): entrou aqui, já está logado em /qgis e /dio. */
const SUPA_URL="https://ytionrwdwdmcxbdgqnkt.supabase.co";
const SUPA_KEY="sb_publishable_MFrDp-4qr0yA2vyX1UJWOw_7RN7rdMX"; // chave publicável (pública por natureza)
const CURSOS=[
  {k:"qgis", nome:"QGIS AESP", cor:"#0f6b5c", url:"/qgis", titulo:"Uso do QGIS como Estratégia de Segurança Pública",
   info:"AESP/CE · Turma 01/2026 · Grupo 1 · 09 a 18/11/2026 · 80 h/a", ini:"2026-11-09T07:30:00-03:00", fim:"2026-11-18T17:30:00-03:00"},
  {k:"dio", nome:"Trilha DIO", cor:"#5b3cc4", url:"/dio", titulo:"Trilha DIO: agentes de IA e dados",
   info:"Do zero ao avançado · 42 itens em 7 fases · 1 h por dia desde 09/11/2026", tabela:"caderno_dio", itens:42, horas:384},
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb=null, sessao=null, ABA=null, RES={};
try{ ABA=localStorage.getItem("cadernos:aba"); }catch(e){}
if(location.hash.slice(1) && CURSOS.some(c=>c.k===location.hash.slice(1))) ABA=location.hash.slice(1);
if(!CURSOS.some(c=>c.k===ABA)) ABA=CURSOS[0].k;
const app=document.getElementById("app");

function telaLogin(msg){
  app.innerHTML=`<form class="card login" id="flogin">
    <div><h1>Cadernos de Estudo</h1><p class="sub">Entre para acessar seus cursos. Use o mesmo e-mail e senha do portal ADMIN CBMCE.</p></div>
    <div><label for="lg-e">E-mail</label><input type="text" id="lg-e" autocomplete="username" inputmode="email" required></div>
    <div><label for="lg-s">Senha</label><input type="password" id="lg-s" autocomplete="current-password" required></div>
    <p class="err" id="lg-err" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <button class="btn pri" type="submit" id="lg-b" style="justify-content:center">Entrar</button>
    <p class="foot" style="margin:0">Sem internet? Os cadernos também funcionam sem login, salvando só neste aparelho: <a href="/qgis">QGIS</a> · <a href="/dio">DIO</a>.</p>
  </form>`;
  document.getElementById("lg-e").focus();
}
async function entrar(){
  const email=document.getElementById("lg-e").value.trim(), password=document.getElementById("lg-s").value;
  const err=document.getElementById("lg-err"), bt=document.getElementById("lg-b");
  err.hidden=true; bt.disabled=true; bt.textContent="Entrando…";
  try{
    const r=await Promise.race([sb.auth.signInWithPassword({email,password}), new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),15000))]);
    if(r.error) throw r.error;
    sessao=r.data.session; telaCursos();
  }catch(e){
    err.hidden=false; bt.disabled=false; bt.textContent="Entrar";
    err.textContent= e.message==="tempo" ? "O servidor não respondeu. Confira a internet e tente de novo." : (/invalid/i.test(e.message||"") ? "E-mail ou senha incorretos." : "Não foi possível entrar: "+(e.message||"erro"));
  }
}

// Resumo de cada curso para a aba (sem baixar o caderno inteiro).
function resumoQGIS(c){
  const t=Date.now(), ini=Date.parse(c.ini), fim=Date.parse(c.fim);
  if(t<ini){ const d=Math.ceil((ini-t)/864e5); return {status:d<=1?"Começa amanhã, 07:30":"Começa em "+d+" dias", pct:0}; }
  if(t>fim) return {status:"Curso concluído", pct:100};
  return {status:"Curso em andamento", pct:Math.round((t-ini)/(fim-ini)*100)};
}
async function resumoDIO(c){
  try{
    const {data,error}=await sb.from(c.tabela).select("id,body").like("id","item-%").limit(200);
    if(error) return {status: /could not find the table|does not exist/i.test(error.message||"")||error.code==="PGRST205"||error.code==="42P01" ? "Falta rodar o SQL caderno_dio.sql no Supabase" : "Progresso indisponível agora"};
    const ok=(data||[]).filter(r=>r.body&&!r.body.apagado&&r.body.st==="ok").length;
    const and=(data||[]).filter(r=>r.body&&!r.body.apagado&&r.body.st==="and").length;
    return {status: ok? ok+" de "+c.itens+" itens concluídos" : (and?"Estudando o primeiro item":"Trilha ainda não iniciada"), ok, pct:Math.round(ok/c.itens*100)};
  }catch(e){ return {status:"Progresso indisponível agora"}; }
}
async function carregarResumos(){
  RES.qgis=resumoQGIS(CURSOS[0]); RES.dio=await resumoDIO(CURSOS[1]); desenhar();
}

function painel(c){
  const r=RES[c.k]||{};
  const kp = c.k==="qgis"
    ? `<div class="kpi"><b>80</b><span>horas-aula</span></div><div class="kpi"><b>9</b><span>disciplinas</span></div><div class="kpi"><b>8</b><span>dias de aula</span></div>`
    : `<div class="kpi"><b>${r.ok??"–"}<span class="mono" style="font-size:14px">/${c.itens}</span></b><span>itens concluídos</span></div><div class="kpi"><b>7</b><span>fases</span></div><div class="kpi"><b>${c.horas}</b><span>horas no essencial</span></div>`;
  return `<section class="card curso" style="--c:${c.cor}" role="tabpanel" aria-labelledby="t-${c.k}">
    <div class="k">${esc(c.nome)}</div>
    <h2>${esc(c.titulo)}</h2>
    <p class="muted" style="margin:0">${esc(c.info)}</p>
    <div class="kpis">${kp}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(r.status||"Carregando…")}</span><span class="mono muted">${r.pct!=null?r.pct+"%":""}</span></div>
    <div class="bar"><i style="width:${r.pct||0}%"></i></div>
    <div class="row" style="margin-top:16px"><a class="btn pri" href="${c.url}" style="background:${c.cor};border-color:${c.cor}">Abrir caderno →</a></div>
  </section>`;
}
function desenhar(){
  const email=sessao&&sessao.user?sessao.user.email:"";
  app.innerHTML=`<div class="top"><div><h1>Cadernos de Estudo</h1><p class="sub">Escolha o curso. Cada caderno guarda anotações, materiais, resumos, questões e tarefas.</p></div>
      <div class="row"><span class="foot">${esc(email)}</span><button class="btn sm" id="sair">Sair</button></div></div>
    <div class="tabs" role="tablist">${CURSOS.map(c=>`<button class="tab" role="tab" id="t-${c.k}" style="--c:${c.cor}" aria-selected="${ABA===c.k}" data-aba="${c.k}"><span class="sw" style="background:${c.cor}"></span>${esc(c.nome)}</button>`).join("")}</div>
    ${painel(CURSOS.find(c=>c.k===ABA))}
    <p class="foot" style="margin:0">Os dados de cada curso ficam separados. Dentro de um caderno, “← Cursos” volta para esta página.</p>`;
}
function telaCursos(){ desenhar(); carregarResumos(); }

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-aba]");
  if(t){ ABA=t.dataset.aba; try{ localStorage.setItem("cadernos:aba",ABA); history.replaceState(null,"","#"+ABA); }catch(x){} desenhar(); return; }
  const s=e.target.closest("#sair");
  if(s){ if(!s.dataset.conf){ s.dataset.conf="1"; s.textContent="Confirmar saída"; setTimeout(()=>{ if(s.isConnected){ delete s.dataset.conf; s.textContent="Sair"; } },3000); return; }
    try{ await sb.auth.signOut(); }catch(x){} sessao=null; telaLogin(); }
});
document.addEventListener("submit",e=>{ if(e.target.id==="flogin"){ e.preventDefault(); entrar(); } });

(async function iniciar(){
  // Quem entrou por link pessoal de convidado vai direto para o caderno do QGIS.
  try{ if(localStorage.getItem("caderno-qgis-convite") && !localStorage.getItem("caderno-qgis-auth")){ location.replace("/qgis"); return; } }catch(e){}
  if(!window.supabase){ telaLogin("Não foi possível carregar o login. Confira a internet e recarregue a página."); return; }
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"caderno-qgis-auth"}});
  try{ sessao=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!sessao && !navigator.onLine){ try{ const g=JSON.parse(localStorage.getItem("caderno-qgis-auth")||"null"); if(g&&g.user) sessao=g; }catch(e){} }
  if(sessao) telaCursos(); else telaLogin(navigator.onLine?undefined:"Sem internet. Entre quando a conexão voltar; os cadernos funcionam offline.");
})();
addEventListener("online",async()=>{ try{ const s=(await sb.auth.getSession()).data.session; if(s){ sessao=s; telaCursos(); } }catch(e){} });
</script>
<script>
/* Funciona sem internet: guarda o app no aparelho (sw.js). */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
