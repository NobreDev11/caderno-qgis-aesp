<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadernos de Estudo</title>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-title" content="Cadernos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Página de entrada: login e uma aba por curso. Cada aba leva ao caderno daquele curso (/qgis, /dio). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18231f; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#e1efeb;
  --ok:#2f7d32; --warn:#a86400; --bad:#b3261e;
  --display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1715; --surface:#16211e; --ink:#e3ece8; --muted:#9aaba5; --line:#2a3834;
    --accent:#4fb8a3; --accent-ink:#0b1311; --accent-soft:#1d3530;
    --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#16211e; --ink:#e3ece8; --muted:#9aaba5; --line:#2a3834;
  --accent:#4fb8a3; --accent-ink:#0b1311; --accent-soft:#1d3530;
  --ok:#7cc47f; --warn:#e0a84a; --bad:#f08a80; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  background-image:repeating-radial-gradient(circle at 110% -20%, transparent 0 26px, color-mix(in srgb,var(--accent) 6%,transparent) 26px 27px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 60px;display:flex;flex-direction:column;gap:20px}
h1{font:800 28px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:800 22px/1.2 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:13px}
input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:14px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--accent)}
.tab[aria-selected="true"]{border-bottom-color:var(--c);color:var(--ink)}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.curso{border-left:6px solid var(--c)}
.curso .k{font:500 12.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.curso h2{margin:6px 0 4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c)}
.foot{font-size:12.5px;color:var(--muted)}
.foot a{color:var(--accent)}
.tab.novo{color:var(--accent)}
.novo-f{display:flex;flex-direction:column;gap:14px}
.fmt2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt2 label{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.fmt2 label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.fmt2 input{position:absolute;opacity:0;pointer-events:none}
.fmt2 b{font:700 15px var(--display)}.fmt2 span{font-size:13px;color:var(--muted)}
.fmt2 label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.cores button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.cores button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;resize:vertical}
@media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr} h1{font-size:24px} .fmt2{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<script src="/vendor/supabase.js"></script>
<script>
"use strict";
/* Mesmo Supabase e mesma sessão dos cadernos (storageKey compartilhada): entrou aqui, já está logado em /qgis e /dio. */
const SUPA_URL="https://ytionrwdwdmcxbdgqnkt.supabase.co";
const SUPA_KEY="sb_publishable_MFrDp-4qr0yA2vyX1UJWOw_7RN7rdMX"; // chave publicável (pública por natureza)
const CURSOS=[
  {k:"qgis", tabela:"caderno_notas", lsp:"caderno-qgis-aesp:", nome:"QGIS AESP", cor:"#0f6b5c", url:"/qgis", titulo:"Uso do QGIS como Estratégia de Segurança Pública",
   info:"AESP/CE · Turma 01/2026 · Grupo 1 · 09 a 18/11/2026 · 80 h/a", ini:"2026-11-09T07:30:00-03:00", fim:"2026-11-18T17:30:00-03:00"},
  {k:"dio", lsp:"caderno-dio:", nome:"Trilha DIO", cor:"#5b3cc4", url:"/dio", titulo:"Trilha DIO: agentes de IA e dados",
   info:"Do zero ao avançado · 42 itens em 7 fases · 1 h por dia desde 09/11/2026", tabela:"caderno_dio", itens:42, horas:384},
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb=null, sessao=null, ABA=null, RES={};
// Cadernos criados no app (tabela caderno_livre, linhas caderno='_'). Cópia local para abrir sem internet.
let LIVRES=[], LIVRES_ERRO="";
try{ LIVRES=JSON.parse(localStorage.getItem("cadernos:livres")||"[]").filter(c=>c&&c.id); }catch(e){}
const CORES=["#0f6b5c","#3b7dd8","#2f9e44","#c9871a","#8a5cd0","#d0453b","#1592a3","#b8407a","#d2622a","#475569"];
const abaLivre=c=>({k:"l:"+c.id, livre:c, nome:c.nome||"Caderno", cor:/^#[0-9a-f]{6}$/i.test(c.cor||"")?c.cor:"#0f6b5c", url:"/livre?n="+encodeURIComponent(c.id)});
// QGIS e DIO: configuração editada (doc cfg-caderno) ou caderno apagado (oculto). Cópia local em <lsp>cfg.
const FIX={}; CURSOS.forEach(c=>{ try{ FIX[c.k]=JSON.parse(localStorage.getItem(c.lsp+"cfg")||"null"); }catch(e){} });
const fixEditado = c => { const f=FIX[c.k]; return f&&!f.padrao&&!f.oculto&&Array.isArray(f.secoes)&&f.secoes.length ? f : null; };
const fixVisiveis = () => CURSOS.filter(c=>!(FIX[c.k]&&FIX[c.k].oculto)).map(c=>{ const f=fixEditado(c); return f?{...c,nome:f.nome&&f.nome!==c.titulo?f.nome.slice(0,28):c.nome,cor:/^#[0-9a-f]{6}$/i.test(f.cor||"")?f.cor:c.cor}:c; });
const todas=()=>[...fixVisiveis(), ...LIVRES.map(abaLivre)];
try{ ABA=localStorage.getItem("cadernos:aba"); }catch(e){}
{ const h=decodeURIComponent(location.hash.slice(1)); if(h && (h==="novo"||todas().some(c=>c.k===h))) ABA=h; }
if(ABA!=="novo"&&!todas().some(c=>c.k===ABA)) ABA=(todas()[0]||{k:"novo"}).k;
const app=document.getElementById("app");

function telaLogin(msg){
  app.innerHTML=`<form class="card login" id="flogin">
    <div><h1>Cadernos de Estudo</h1><p class="sub">Entre para acessar seus cursos. Use o mesmo e-mail e senha do portal ADMIN CBMCE.</p></div>
    <div><label for="lg-e">E-mail</label><input type="text" id="lg-e" autocomplete="username" inputmode="email" required></div>
    <div><label for="lg-s">Senha</label><input type="password" id="lg-s" autocomplete="current-password" required></div>
    <p class="err" id="lg-err" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <button class="btn pri" type="submit" id="lg-b" style="justify-content:center">Entrar</button>
    <p class="foot" style="margin:0">Sem internet? Os cadernos também funcionam sem login, salvando só neste aparelho: <a href="/qgis">QGIS</a> · <a href="/dio">DIO</a>.</p>
  </form>`;
  document.getElementById("lg-e").focus();
}
async function entrar(){
  const email=document.getElementById("lg-e").value.trim(), password=document.getElementById("lg-s").value;
  const err=document.getElementById("lg-err"), bt=document.getElementById("lg-b");
  err.hidden=true; bt.disabled=true; bt.textContent="Entrando…";
  try{
    const r=await Promise.race([sb.auth.signInWithPassword({email,password}), new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),15000))]);
    if(r.error) throw r.error;
    sessao=r.data.session; telaCursos();
  }catch(e){
    err.hidden=false; bt.disabled=false; bt.textContent="Entrar";
    err.textContent= e.message==="tempo" ? "O servidor não respondeu. Confira a internet e tente de novo." : (/invalid/i.test(e.message||"") ? "E-mail ou senha incorretos." : "Não foi possível entrar: "+(e.message||"erro"));
  }
}

// Resumo de cada curso para a aba (sem baixar o caderno inteiro).
function resumoQGIS(c){
  const t=Date.now(), ini=Date.parse(c.ini), fim=Date.parse(c.fim);
  if(t<ini){ const d=Math.ceil((ini-t)/864e5); return {status:d<=1?"Começa amanhã, 07:30":"Começa em "+d+" dias", pct:0}; }
  if(t>fim) return {status:"Curso concluído", pct:100};
  return {status:"Curso em andamento", pct:Math.round((t-ini)/(fim-ini)*100)};
}
async function resumoDIO(c){
  try{
    const {data,error}=await sb.from(c.tabela).select("id,body").like("id","item-%").limit(200);
    if(error) return {status: /could not find the table|does not exist/i.test(error.message||"")||error.code==="PGRST205"||error.code==="42P01" ? "Falta rodar o SQL caderno_dio.sql no Supabase" : "Progresso indisponível agora"};
    const ok=(data||[]).filter(r=>r.body&&!r.body.apagado&&r.body.st==="ok").length;
    const and=(data||[]).filter(r=>r.body&&!r.body.apagado&&r.body.st==="and").length;
    return {status: ok? ok+" de "+c.itens+" itens concluídos" : (and?"Estudando o primeiro item":"Trilha ainda não iniciada"), ok, pct:Math.round(ok/c.itens*100)};
  }catch(e){ return {status:"Progresso indisponível agora"}; }
}
async function carregarLivres(){
  try{
    const {data,error}=await sb.from("caderno_livre").select("id,body,updated_at").eq("caderno","_").order("updated_at",{ascending:true}).limit(200);
    if(error) throw error;
    LIVRES=(data||[]).map(r=>({...r.body,id:r.id})).filter(c=>!c.apagado).sort((a,b)=>(a.criado||0)-(b.criado||0)); LIVRES_ERRO="";
    try{ localStorage.setItem("cadernos:livres",JSON.stringify(LIVRES)); LIVRES.forEach(c=>{ const k="caderno-livre:cfg:"+c.id, v=JSON.parse(localStorage.getItem(k)||"null"); if(!v||(c.upd||0)>(v.upd||0)) localStorage.setItem(k,JSON.stringify(c)); }); }catch(e){}
  }catch(e){ LIVRES_ERRO = (e.code==="PGRST205"||e.code==="42P01"||/could not find the table|does not exist/i.test(e.message||"")) ? "Para criar cadernos, rode uma vez o SQL supabase/caderno_livre.sql no Supabase do Checklist." : ""; }
}
// Progresso de um caderno livre: trilha = itens concluídos; curso = aulas que já passaram no calendário
async function resumoLivre(c,tabela){
  if(c.tipo==="trilha"){
    const its=c.itens||[], hT=its.reduce((s,i)=>s+(Number(i.h)||0),0);
    try{ let q=sb.from(tabela||"caderno_livre").select("id,body"); if(!tabela) q=q.eq("caderno",c.id); const {data,error}=await q.like("id","item-%").limit(1000); if(error) throw error;
      const ok=new Set((data||[]).filter(r=>r.body&&!r.body.apagado&&r.body.st==="ok").map(r=>r.id.slice(5)));
      const n=its.filter(i=>ok.has(i.id)).length, h=its.filter(i=>ok.has(i.id)).reduce((s,i)=>s+(Number(i.h)||0),0);
      return {status:n?n+" de "+its.length+" itens concluídos":"Ainda não iniciado", ok:n, pct:hT?Math.round(h/hT*100):(its.length?Math.round(n/its.length*100):0)};
    }catch(e){ return {status:"Progresso indisponível agora"}; }
  }
  const dias=[...(c.dias||[])].sort(), hs=(c.horarios||[]).filter(h=>!h.int); if(!dias.length||!hs.length) return {status:"Sem dias de aula definidos", pct:0};
  const t=Date.now(), ini=Date.parse(dias[0]+"T"+hs[0].ini+":00-03:00"), fim=Date.parse(dias[dias.length-1]+"T"+hs[hs.length-1].fim+":00-03:00");
  if(t<ini){ const d=Math.ceil((ini-t)/864e5); return {status:d<=1?"Começa amanhã, "+hs[0].ini:"Começa em "+d+" dias", pct:0}; }
  if(t>fim) return {status:"Curso concluído", pct:100};
  return {status:"Curso em andamento", pct:Math.round((t-ini)/(fim-ini)*100)};
}
async function carregarFixos(){
  for(const c of CURSOS){ try{ const {data,error}=await sb.from(c.tabela).select("body").eq("id","cfg-caderno").maybeSingle(); if(error) continue;
      const b=data&&data.body; const l=FIX[c.k]; if(b&&(!l||(b.upd||0)>=(l.upd||0))){ FIX[c.k]=b; try{ localStorage.setItem(c.lsp+"cfg",JSON.stringify(b)); }catch(e){} } }catch(e){} }
  if(ABA!=="novo"&&!todas().some(c=>c.k===ABA)) ABA=(todas()[0]||{k:"novo"}).k;
}
async function carregarResumos(){
  await carregarFixos();
  RES.qgis=fixEditado(CURSOS[0])?await resumoLivre(fixEditado(CURSOS[0])):resumoQGIS(CURSOS[0]); desenhar();
  await carregarLivres(); desenhar();
  RES.dio=fixEditado(CURSOS[1])?await resumoLivre(fixEditado(CURSOS[1]),"caderno_dio"):await resumoDIO(CURSOS[1]); desenhar();
  for(const c of LIVRES){ RES["l:"+c.id]=await resumoLivre(c); if(ABA==="l:"+c.id) desenhar(); }
  desenhar();
}

function painelLivre(a,fixo){
  const c=a.livre, r=RES[a.k]||{}, tr=c.tipo==="trilha", secs=c.secoes||[];
  const kp = tr
    ? `<div class="kpi"><b>${r.ok??"–"}<span class="mono" style="font-size:14px">/${(c.itens||[]).length}</span></b><span>itens concluídos</span></div><div class="kpi"><b>${secs.length}</b><span>fases</span></div><div class="kpi"><b>${(c.itens||[]).reduce((s,i)=>s+(Number(i.h)||0),0)}</b><span>horas</span></div>`
    : `<div class="kpi"><b>${secs.reduce((s,x)=>s+(Number(x.ha)||0),0)}</b><span>aulas</span></div><div class="kpi"><b>${secs.length}</b><span>disciplinas</span></div><div class="kpi"><b>${(c.dias||[]).length}</b><span>dias de aula</span></div>`;
  return `<section class="card curso" style="--c:${a.cor}" role="tabpanel" aria-labelledby="t-${esc(a.k)}">
    <div class="k">${tr?"Trilha de estudo":"Curso com aulas"} · ${fixo?"configuração editada":"criado no app"}</div>
    <h2>${esc(c.nome||"Caderno")}</h2>
    <p class="muted" style="margin:0">${esc(c.sub||c.desc||"")}</p>
    <div class="kpis">${kp}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(r.status||"Carregando…")}</span><span class="mono muted">${r.pct!=null?r.pct+"%":""}</span></div>
    <div class="bar"><i style="width:${r.pct||0}%"></i></div>
    <div class="row" style="margin-top:16px"><a class="btn pri" href="${esc(a.url)}" style="background:${a.cor};border-color:${a.cor}">Abrir caderno →</a><a class="btn" href="${esc(a.url)}#configurar">Configurar</a></div>
  </section>`;
}
function painelNovo(){
  return `<form class="card novo-f" id="fnovo" role="tabpanel" aria-labelledby="t-novo">
    <div><h2>Novo caderno</h2><p class="sub">Crie um caderno com as mesmas ferramentas dos outros (anotações, materiais, resumos, questões, flashcards, projetos, tarefas). Depois, tudo é editável na aba Configurar.</p></div>
    ${LIVRES_ERRO?`<p class="err" style="margin:0">${esc(LIVRES_ERRO)}</p>`:""}
    <div><label for="nv-nome">Nome do caderno</label><input type="text" id="nv-nome" maxlength="80" required placeholder="Ex.: Excel avançado, Inglês, Concurso CBMCE"></div>
    <div><label>Formato</label><div class="fmt2">
      <label><input type="radio" name="nv-tipo" value="curso" checked><b>Curso com aulas e datas</b><span>Disciplinas, dias e horários de aula, presença e cronograma (como o caderno QGIS).</span></label>
      <label><input type="radio" name="nv-tipo" value="trilha"><b>Trilha de estudo</b><span>Fases e itens no seu ritmo, com horas, links, prompt de estudo e portfólio (como o caderno DIO).</span></label>
    </div></div>
    <div><label for="nv-sub">Subtítulo (opcional)</label><input type="text" id="nv-sub" maxlength="120" placeholder="Ex.: Turma 2026 · 40 h · noite"></div>
    <div><label for="nv-desc">Sobre o que é e qual o seu objetivo (opcional)</label><textarea id="nv-desc" rows="2" maxlength="700" placeholder="A IA usa este texto para fazer resumos, questões e explicações no contexto certo."></textarea></div>
    <div><label>Cor</label><div class="cores">${CORES.map((x,i)=>`<button type="button" data-nvcor="${x}" style="background:${x}" aria-pressed="${i===LIVRES.length%CORES.length?"true":"false"}" aria-label="Cor ${x}"></button>`).join("")}</div></div>
    ${CURSOS.filter(c=>FIX[c.k]&&FIX[c.k].oculto).map(c=>`<div class="row" style="justify-content:space-between;border:1px dashed var(--line);border-radius:10px;padding:10px 12px"><span><b>${esc(c.nome)}</b> <span class="muted">foi apagado. Pode trazê-lo de volta, vazio e com a configuração original.</span></span><button type="button" class="btn sm" data-restaurar="${c.k}">Trazer de volta</button></div>`).join("")}
    <p class="err" id="nv-err" hidden></p>
    <div class="row"><button class="btn pri" type="submit" id="nv-b">Criar caderno</button><span class="foot">Os dados de cada caderno ficam separados.</span></div>
  </form>`;
}
function painel(c){
  const f=fixEditado(c); if(f) return painelLivre({k:c.k, livre:f, cor:/^#[0-9a-f]{6}$/i.test(f.cor||"")?f.cor:c.cor, url:c.url}, true);
  const r=RES[c.k]||{};
  const kp = c.k==="qgis"
    ? `<div class="kpi"><b>80</b><span>horas-aula</span></div><div class="kpi"><b>9</b><span>disciplinas</span></div><div class="kpi"><b>8</b><span>dias de aula</span></div>`
    : `<div class="kpi"><b>${r.ok??"–"}<span class="mono" style="font-size:14px">/${c.itens}</span></b><span>itens concluídos</span></div><div class="kpi"><b>7</b><span>fases</span></div><div class="kpi"><b>${c.horas}</b><span>horas no essencial</span></div>`;
  return `<section class="card curso" style="--c:${c.cor}" role="tabpanel" aria-labelledby="t-${c.k}">
    <div class="k">${esc(c.nome)}</div>
    <h2>${esc(c.titulo)}</h2>
    <p class="muted" style="margin:0">${esc(c.info)}</p>
    <div class="kpis">${kp}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(r.status||"Carregando…")}</span><span class="mono muted">${r.pct!=null?r.pct+"%":""}</span></div>
    <div class="bar"><i style="width:${r.pct||0}%"></i></div>
    <div class="row" style="margin-top:16px"><a class="btn pri" href="${c.url}" style="background:${c.cor};border-color:${c.cor}">Abrir caderno →</a></div>
  </section>`;
}
function abasHTML(){ return todas().map(c=>`<button class="tab" role="tab" id="t-${esc(c.k)}" style="--c:${c.cor}" aria-selected="${ABA===c.k}" data-aba="${esc(c.k)}"><span class="sw" style="background:${c.cor}"></span>${esc(c.nome)}</button>`).join("")+`<button class="tab novo" role="tab" id="t-novo" style="--c:var(--accent)" aria-selected="${ABA==="novo"}" data-aba="novo">+ Novo caderno</button>`; }
function desenhar(forcar){
  // com o formulário de novo caderno aberto, só atualiza as abas (não apaga o que está sendo digitado)
  if(!forcar&&ABA==="novo"&&document.getElementById("fnovo")){ const t=document.querySelector(".tabs"); if(t) t.innerHTML=abasHTML(); return; }
  const email=sessao&&sessao.user?sessao.user.email:"";
  app.innerHTML=`<div class="top"><div><h1>Cadernos de Estudo</h1><p class="sub">Escolha o curso. Cada caderno guarda anotações, materiais, resumos, questões e tarefas.</p></div>
      <div class="row"><span class="foot">${esc(email)}</span><button class="btn sm" id="sair">Sair</button></div></div>
    <div class="tabs" role="tablist">${abasHTML()}</div>
    ${ABA==="novo"?painelNovo():ABA.startsWith("l:")?painelLivre(todas().find(c=>c.k===ABA)||abaLivre({id:"x"})):painel(CURSOS.find(c=>c.k===ABA)||CURSOS[0])}
    <p class="foot" style="margin:0">Os dados de cada curso ficam separados. Dentro de um caderno, “← Cursos” volta para esta página.</p>`;
}
function telaCursos(){ desenhar(); carregarResumos(); }

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-aba]");
  if(t){ ABA=t.dataset.aba; try{ localStorage.setItem("cadernos:aba",ABA); history.replaceState(null,"","#"+ABA); }catch(x){} desenhar(true); if(ABA==="novo"){ const n=document.getElementById("nv-nome"); if(n) n.focus(); } return; }
  const rs=e.target.closest("[data-restaurar]");
  if(rs){ const c=CURSOS.find(x=>x.k===rs.dataset.restaurar); rs.disabled=true; rs.textContent="Restaurando…";
    const body={tipo:"cfg",padrao:true,upd:Date.now()};
    try{ const uid=sessao&&sessao.user&&sessao.user.id; const r=await sb.from(c.tabela).upsert({user_id:uid,id:"cfg-caderno",body,upd:body.upd},{onConflict:"user_id,id"}); if(r.error) throw r.error; }
    catch(x){ rs.disabled=false; rs.textContent="Trazer de volta"; alert("Não consegui restaurar: "+(x.message||x)); return; }
    FIX[c.k]=body; try{ localStorage.setItem(c.lsp+"cfg",JSON.stringify(body)); }catch(x){} ABA=c.k; try{ localStorage.setItem("cadernos:aba",ABA); }catch(x){} desenhar(true); carregarResumos(); return; }
  const cb=e.target.closest("[data-nvcor]");
  if(cb){ document.querySelectorAll("[data-nvcor]").forEach(x=>x.setAttribute("aria-pressed",String(x===cb))); return; }
  const s=e.target.closest("#sair");
  if(s){ if(!s.dataset.conf){ s.dataset.conf="1"; s.textContent="Confirmar saída"; setTimeout(()=>{ if(s.isConnected){ delete s.dataset.conf; s.textContent="Sair"; } },3000); return; }
    try{ await sb.auth.signOut(); }catch(x){} sessao=null; telaLogin(); }
});
document.addEventListener("submit",e=>{ if(e.target.id==="flogin"){ e.preventDefault(); entrar(); } if(e.target.id==="fnovo"){ e.preventDefault(); criarCaderno(); } });

// Configuração inicial de um caderno novo (tudo muda depois em Configurar)
function proxDiasUteis(n){ const out=[]; let d=new Date(Date.now()-3*36e5); d.setUTCDate(d.getUTCDate()+1); while(out.length<n){ const w=d.getUTCDay(); if(w!==0&&w!==6) out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); } return out; }
function cfgInicial(tipo,nome,sub,desc,cor){
  const base={v:1,tipo,nome,sub,desc,cor,criado:Date.now(),upd:Date.now(),abas:{}};
  if(tipo==="trilha") return {...base, inicio:new Date(Date.now()-3*36e5).toISOString().slice(0,10), horasSemana:7, plat:"",
    secoes:[{k:"s1",nome:"Fase 1",curto:"",ha:2,inst:[],cor:"#3b7dd8"},{k:"s2",nome:"Fase 2",curto:"",ha:2,inst:[],cor:"#2f9e44"}],
    itens:[{id:"i1",k:"s1",nome:"Primeiro item",tipo:"Curso",h:1,url:""},{id:"i2",k:"s1",nome:"Segundo item",tipo:"Curso",h:1,url:""},{id:"i3",k:"s2",nome:"Projeto da fase",tipo:"Projeto",h:2,url:""}]};
  return {...base, presenca:true, local:"",
    secoes:[{k:"s1",nome:"Disciplina 1",curto:"",ha:10,inst:[],cor:"#3b7dd8"},{k:"s2",nome:"Disciplina 2",curto:"",ha:10,inst:[],cor:"#2f9e44"}],
    dias:proxDiasUteis(5), horarios:[{ini:"08:00",fim:"08:50"},{ini:"08:50",fim:"09:40"},{int:"Intervalo",ini:"09:40",fim:"10:00"},{ini:"10:00",fim:"10:50"},{ini:"10:50",fim:"11:40"}]};
}
async function criarCaderno(){
  const nome=document.getElementById("nv-nome").value.trim(), err=document.getElementById("nv-err"), bt=document.getElementById("nv-b");
  const tipo=(document.querySelector('input[name="nv-tipo"]:checked')||{}).value==="trilha"?"trilha":"curso";
  const cor=(document.querySelector('[data-nvcor][aria-pressed="true"]')||{}).dataset?.nvcor||CORES[0];
  if(!nome){ err.hidden=false; err.textContent="Dê um nome ao caderno."; return; }
  const slug=nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,28)||"caderno";
  const id=slug+"-"+Math.random().toString(36).slice(2,6);
  const cfg=cfgInicial(tipo,nome,document.getElementById("nv-sub").value.trim(),document.getElementById("nv-desc").value.trim(),cor);
  err.hidden=true; bt.disabled=true; bt.textContent="Criando…";
  try{
    const uid=sessao&&sessao.user&&sessao.user.id; if(!uid) throw new Error("Entre com a sua conta para criar cadernos.");
    const r=await Promise.race([sb.from("caderno_livre").insert({user_id:uid,caderno:"_",id,body:cfg,upd:cfg.upd}), new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo")),15000))]);
    if(r.error) throw r.error;
  }catch(e){
    bt.disabled=false; bt.textContent="Criar caderno"; err.hidden=false;
    err.textContent = e.message==="tempo" ? "O servidor não respondeu. Confira a internet e tente de novo." : (e.code==="PGRST205"||e.code==="42P01"||/could not find the table|does not exist/i.test(e.message||"")) ? "Falta rodar o SQL supabase/caderno_livre.sql no Supabase do Checklist (uma vez só)." : "Não consegui criar: "+(e.message||e);
    return;
  }
  try{ localStorage.setItem("caderno-livre:cfg:"+id,JSON.stringify(cfg)); LIVRES.push({...cfg,id}); localStorage.setItem("cadernos:livres",JSON.stringify(LIVRES)); localStorage.setItem("cadernos:aba","l:"+id); }catch(e){}
  location.href="/livre?n="+encodeURIComponent(id)+"#configurar";
}

(async function iniciar(){
  // Quem entrou por link pessoal de convidado vai direto para o caderno do QGIS.
  try{ if(localStorage.getItem("caderno-qgis-convite") && !localStorage.getItem("caderno-qgis-auth")){ location.replace("/qgis"); return; } }catch(e){}
  if(!window.supabase){ telaLogin("Não foi possível carregar o login. Confira a internet e recarregue a página."); return; }
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"caderno-qgis-auth"}});
  try{ sessao=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!sessao && !navigator.onLine){ try{ const g=JSON.parse(localStorage.getItem("caderno-qgis-auth")||"null"); if(g&&g.user) sessao=g; }catch(e){} }
  if(sessao) telaCursos(); else telaLogin(navigator.onLine?undefined:"Sem internet. Entre quando a conexão voltar; os cadernos funcionam offline.");
})();
addEventListener("online",async()=>{ try{ const s=(await sb.auth.getSession()).data.session; if(s){ sessao=s; telaCursos(); } }catch(e){} });
</script>
<script>
/* Funciona sem internet: guarda o app no aparelho (sw.js). */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
